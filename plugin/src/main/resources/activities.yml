# Controls the rewards players receive for performing activities with their partner.
#
# Each activity supports the following options:
#   cooldown: Time in seconds before the activity can reward hearts again.
#   hearts: Number of hearts awarded when the reward succeeds.
#   chance: Probability of receiving the reward (0-100).
#
# Cooldowns are shared between both partners and are tracked per couple.
# Changes can be applied by reloading the configuration.
