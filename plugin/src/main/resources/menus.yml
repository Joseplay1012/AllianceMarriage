marriage:
  title: "&d&lMarriage Menu"
  rows: 4
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  items:
    partner-head:
      slot: 13
      material: PLAYER_HEAD
      name: "&d&l%partner%"
      lore:
        - "&7Married since: &e%date%"
        - "&7Marriage duration: &e%duration%"
        - "&7Status: &aHappily Married"
    shop:
      slot: 20
      material: CHEST
      name: "&c&l♥ Hearts Shop"
      lore:
        - "&7Browse and purchase exclusive rewards"
        - "&7using your shared Hearts!"
        - ""
        - "&aClick to open shop!"
    hearts:
      slot: 22
      material: NETHER_STAR
      name: "&c&l♥ %hearts% Hearts"
      lore:
        - "&7Your couple's current Hearts balance."
        - "&7Complete activities together to earn more!"
    status:
      slot: 24
      material: BOOK
      name: "&e&lMarriage Status"
      lore:
        - "&7Partner: &f%partner%"
        - "&7Online: %online%"
        - "&7Anniversary: &e%date%"
        - "&7Duration: &e%duration%"
    divorce:
      slot: 31
      material: SHEARS
      name: "&c&lDivorce"
      lore:
        - "&7Click to end your marriage with &f%partner%&7."
        - "&cWarning: This action is permanent!"
    close:
      slot: 35
      material: ARROW
      name: "&7Close"
      lore:
        - "&7Close this menu."
    not-married:
      slot: 13
      material: BARRIER
      name: "&cNot Married"
      lore:
        - "&7You are not currently married."
        - ""
        - "&eUse /marry <player> to propose to someone!"
    unmarried-close:
      slot: 22
      material: ARROW
      name: "&7Close"

request:
  title: "&d&lMarriage Proposal"
  rows: 3
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  items:
    head:
      slot: 13
      material: PLAYER_HEAD
      name: "&d&l%player%"
      lore:
        - "&7Has proposed marriage to you!"
        - ""
        - "&eWill you marry this player?"
    accept:
      slot: 11
      material: LIME_CONCRETE
      name: "&a&lACCEPT"
      lore:
        - "&7Click to accept the proposal and marry"
        - "&f%player%&7!"
        - ""
        - "&aClick to accept"
    deny:
      slot: 15
      material: RED_CONCRETE
      name: "&c&lDENY"
      lore:
        - "&7Click to decline the proposal from"
        - "&f%player%&7."
        - ""
        - "&cClick to decline"

couple-settings:
  title: "Settings"
  rows: 5
  preference-slots: [10, 12, 14, 16, 20, 22, 24, 28, 30, 32, 34]
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  items:
    next:
      slot: 41
      material: ARROW
      name: "Next page"
    back:
      slot: 39
      material: ARROW
      name: "Back page"
    close:
      slot: 40
      material: RED_DYE
      name: "Close"
  preferences:
    pvp:
      material: DIAMOND_SWORD
      name: "&cPVP"
      lore:
        - "&fStatus: %status%"
      status-active: "&cActive"
      status-inactive: "&aInactive"
    points:
      material: DIAMOND
      name: "&aAdd Points"
      lore:
        - "&anow %hearts%"

hearts-shop:
  title: "&c&l♥ &8Hearts Shop"
  rows: 6
  product-slots: [2, 3, 5, 6, 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 29, 30, 31, 32, 33, 39, 40, 41]
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
  items:
    empty-product:
      material: PINK_STAINED_GLASS_PANE
      name: "&d♥"
      hide-tooltip: true
    back:
      slot: 45
      material: ARROW
      name: "&e« Back to Marriage Menu"
      lore:
        - "&7Return to your main marriage overview."
    previous:
      slot: 48
      material: SPECTRAL_ARROW
      name: "&a« Previous Page"
      lore:
        - "&7Go to page %page%"
    previous-disabled:
      slot: 48
      material: BARRIER
      name: "&7« Previous Page"
      lore:
        - "&8No previous page available."
    page-info:
      slot: 49
      material: NETHER_STAR
      name: "&ePage &6%page% &e/ &6%pages%"
      lore:
        - "&7Your Hearts: &c♥ %hearts%"
        - "&7Total Products: &f%total%"
        - ""
        - "&8Click products in the heart layout to purchase!"
    next:
      slot: 50
      material: SPECTRAL_ARROW
      name: "&aNext Page »"
      lore:
        - "&7Go to page %page%"
    next-disabled:
      slot: 50
      material: BARRIER
      name: "&7Next Page »"
      lore:
        - "&8No next page available."
    close:
      slot: 53
      material: RED_DYE
      name: "&cClose"
      lore:
        - "&7Close the Hearts shop."
